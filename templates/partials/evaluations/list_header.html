    <!-- Top Navigation -->
    <header class="evaluation-list-header sticky top-0 z-30 flex-shrink-0">
        <div class="evaluation-list-header__grid" aria-hidden="true"></div>
        <div class="evaluation-list-header__aurora evaluation-list-header__aurora--one" aria-hidden="true"></div>
        <div class="evaluation-list-header__aurora evaluation-list-header__aurora--two" aria-hidden="true"></div>

        <div class="evaluation-list-header__inner max-w-full mx-auto h-full flex justify-between items-center">
            <div class="evaluation-list-header__left flex items-center">
                
                <!-- FILTER TOGGLE BUTTON -->
                <button id="evaluationFilterToggle" type="button" onclick="toggleSidebar()" aria-label="Filters" aria-controls="filterSidebar" aria-expanded="false" class="evaluation-filter-toggle lakshya-filter-toggle flex items-center gap-2 transition border">
                    <i class="fas fa-sliders-h"></i>
                    <span class="text-xs font-bold uppercase hidden sm:inline">Filters</span>
                    {% if filters.semester_status or filters.semester or filters.year or filters.ticket_no or filters.employee_name %}
                        <span class="evaluation-filter-toggle__active"></span>
                    {% endif %}
                </button>

                <div class="evaluation-list-title flex items-center">
                    <div class="evaluation-list-title__icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <h1>Evaluations List</h1>
                </div>
            </div>

            <div class="evaluation-list-header__actions flex items-center">
                <form method="POST" action="{{ url_for('auth.logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="evaluation-list-logout" aria-label="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </form>
            </div>
        </div>
    </header>

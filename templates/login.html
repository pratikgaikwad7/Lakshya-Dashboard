<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | LAKSHYA Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}">
</head>
<body class="login-page">
    <main class="login-layout">
        <section class="login-access" aria-labelledby="loginTitle">
            <div class="login-access__inner">
                <a class="login-brand" href="{{ url_for('auth.login_page') }}" aria-label="LAKSHYA sign in">
                    <span class="login-brand__mark"><i class="fas fa-rocket" aria-hidden="true"></i></span>
                    <span><strong>LAKSHYA Dashboard</strong></span>
                </a>

                <div class="login-copy">
                    <h1 id="loginTitle">Welcome back</h1>
                    <p>Sign in with your authorized account to continue.</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                    <div class="login-alert login-alert--{{ 'error' if category == 'error' else 'success' }}" role="alert">
                        <i class="fas {{ 'fa-circle-exclamation' if category == 'error' else 'fa-circle-check' }}" aria-hidden="true"></i>
                        <span>{{ message }}</span>
                    </div>
                    {% endfor %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.login') }}" class="login-form" data-login-form>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="login-field">
                        <label for="usernameInput">User ID</label>
                        <div class="login-control">
                            <i class="fas fa-user" aria-hidden="true"></i>
                            <input id="usernameInput" type="text" name="username" placeholder="Enter your user ID" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                        </div>
                    </div>
                    <div class="login-field">
                        <label for="passwordInput">Password</label>
                        <div class="login-control">
                            <i class="fas fa-lock" aria-hidden="true"></i>
                            <input id="passwordInput" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button id="passwordToggle" type="button" class="login-password-toggle" aria-label="Show password" aria-pressed="false">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="login-submit"><span>Sign in</span><i class="fas fa-arrow-right" aria-hidden="true"></i></button>
                </form>

                <p class="login-security"><i class="fas fa-shield-halved" aria-hidden="true"></i> Authorized personnel only</p>
            </div>
        </section>

        <aside class="login-showcase" aria-label="LAKSHYA Dashboard">
            <div class="login-showcase__copy">
                <h2>LAKSHYA Dashboard</h2>
            </div>
            <figure class="login-poster">
                <img src="{{ url_for('static', filename='images/poster.jpg') }}" alt="LAKSHYA Earn and Learn programme">
            </figure>
        </aside>
    </main>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
